<style>
:root{--purple:#1c0b2e;--pink:#F1F7ED;--candy:#ec6aa3;
  --display:"Unbounded","Arial Black",system-ui,sans-serif;
  --body:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--purple);color:var(--pink);font-family:var(--body);min-height:100svh;display:grid;place-items:center;text-align:center;padding:24px}
.kicker{font-family:var(--display);color:var(--candy);letter-spacing:.2em;font-size:13px;text-transform:uppercase}
h1{font-family:var(--display);font-weight:800;font-size:clamp(64px,16vw,160px);line-height:1;letter-spacing:-.03em;margin:18px 0 14px}
p{color:rgba(241,247,237,.75);max-width:44ch;margin:0 auto 30px;line-height:1.65;font-size:16px}
a{display:inline-flex;align-items:center;gap:10px;text-decoration:none;background:var(--pink);color:var(--purple);
  font-family:var(--display);font-weight:600;font-size:15px;padding:15px 26px;border-radius:99px;transition:transform .25s}
a:hover{transform:translateY(-2px)}
svg{width:17px}
</style>
</head>

<main>
